<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos No Lineales</title>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Estilos generales */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            color: white;
            text-align: center;
            background: linear-gradient(135deg, rgba(30, 60, 114, 0.9), rgba(42, 82, 152, 0.9)), 
                        url('Fondo1.avif') center/cover no-repeat fixed;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Asegura que el cuerpo ocupe toda la altura de la pantalla */
        }

        h1 {
            font-family: 'Lobster', cursive;
            font-size: 3.5rem;
            margin: 2rem 0;
            color: #ff9f43;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            margin-top: 2rem; /* Ajusta este valor para bajar más el contenido */
        }

        .grid-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .grid-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }

        .grid-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 1rem;
            border: 3px solid #ff9f43;
            transition: transform 0.3s ease;
        }

        .grid-item img:hover {
            transform: scale(1.1);
        }

        .grid-item a {
            display: block;
            color: white;
            font-size: 1.2rem;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .grid-item a:hover {
            color: #ff9f43;
        }

        .grid-item .title {
            margin-top: 1rem;
            text-align: center;
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .grid-item {
            animation: fadeIn 0.6s ease-out;
        }

        /* Fondo dinámico */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('fondo2.jpg') center/cover no-repeat fixed;
            opacity: 0.5;
            z-index: -1;
            filter: blur(5px);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>Datos No Lineales</h1>
    <div class="grid-container">
        <div class="grid-item">
            <a href="juego_caballo.html">
                <img src="caballo.jpeg" alt="Caballo">
            </a>
            <div class="title">
                <a href="juego_caballo.html">Juego del Caballo</a>
            </div>
        </div>
        <div class="grid-item">
            <a href="Grafos.html">
                <img src="ImagG.jpeg" alt="Grafos">
            </a>
            <div class="title">
                <a href="Grafos.html">Grafos</a>
            </div>
        </div>
        <div class="grid-item">
            <a href="Torre.html">
                <img src="ImgHa.jpg" alt="Torres de Hanói">
            </a>
            <div class="title">
                <a href="Torre.html">Torres de Hanói</a>
            </div>
        </div>
        <div class="grid-item">
            <a href="Parcial.html">
                <img src="PArI.jpeg" alt="Parcial">
            </a>
            <div class="title">
                <a href="Parcial.html">Parcial</a>
            </div>
        </div>
    </div>
</body>
</html>
