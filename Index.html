<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos No Lineales</title>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            color: white;
            text-align: center;
            background: linear-gradient(135deg, rgba(30, 60, 114, 0.9), rgba(42, 82, 152, 0.9)), 
                        url('Fondo1.avif') center/cover no-repeat fixed;
            overflow-x: hidden;
            min-height: 100vh;
        }

        h1 {
            font-family: 'Lobster', cursive;
            font-size: 3rem;
            margin: 2rem 0;
            color: #ff9f43;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .main-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            padding: 2rem;
            max-width: 1400px;
            margin: auto;
        }

        .corte {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 1rem;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .corte h2 {
            color: #ff9f43;
            margin-bottom: 1.5rem;
        }

        .grid-item {
            margin-bottom: 2rem;
            animation: fadeIn 0.6s ease-out;
        }

        .grid-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 1rem;
            border: 3px solid #ff9f43;
            transition: transform 0.3s ease;
        }

        .grid-item img:hover {
            transform: scale(1.1);
        }

        .grid-item a {
            display: block;
            color: white;
            font-size: 1.1rem;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .grid-item a:hover {
            color: #ff9f43;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>Datos No Lineales</h1>
    <div class="main-grid">
        <!-- Primer corte -->
        <div class="corte">
            <h2>Primer Corte</h2>
            <div class="grid-item">
                <a href="juego_caballo.html"><img src="caballo.jpeg" alt="Caballo"></a>
                <a href="juego_caballo.html">Juego del Caballo</a>
            </div>
            <div class="grid-item">
                <a href="Grafos.html"><img src="ImagG.jpeg" alt="Grafos"></a>
                <a href="Grafos.html">Grafos</a>
            </div>
            <div class="grid-item">
                <a href="Torre.html"><img src="ImgHa.jpg" alt="Torres de Hanói"></a>
                <a href="Torre.html">Torres de Hanói</a>
            </div>
            <div class="grid-item">
                <a href="Parcial.html"><img src="PArI.jpeg" alt="Parcial"></a>
                <a href="Parcial.html">Parcial</a>
            </div>
        </div>

        <!-- Segundo corte -->
        <div class="corte">
            <h2>Segundo Corte</h2>
            <div class="grid-item">
                <a href="Floyd.html"><img src="FloydI.png" alt="Floyd"></a>
                <a href="Floyd.html">Floyd</a>
            </div>
            <div class="grid-item">
                <a href="Python.html"><img src="PythonI.jpg" alt="Parcial 2"></a>
                <a href="Python.html">Parcial 2</a>
            </div>
        </div>

        <!-- Tercer corte -->
        <div class="corte">
            <h2>Tercer Corte</h2>
            <!-- Aquí puedes agregar elementos del tercer corte -->
        </div>
    </div>
</body>
</html>
